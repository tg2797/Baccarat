<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<title>給料計算</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { color-scheme: dark; }
  html { background:#000000 !important; }
  body {
    background:#000000 !important; color:#FFFFFF; min-height:100dvh; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    -webkit-font-smoothing:antialiased; letter-spacing:0.1px;
    padding-bottom:calc(50px + env(safe-area-inset-bottom));
  }
  #bgfill { position:fixed; inset:0; background:#000000; z-index:-1; }
  input { font-family:inherit; -webkit-appearance:none; appearance:none; background-color:transparent; color:#FFFFFF; -webkit-text-fill-color:#FFFFFF; caret-color:#E8B765; }
  input::placeholder { color:rgba(235,235,245,0.4); -webkit-text-fill-color:rgba(235,235,245,0.4); }
  input:focus { outline:none; }
  input:-webkit-autofill, input:-webkit-autofill:focus {
    -webkit-text-fill-color:#FFFFFF; caret-color:#E8B765;
    transition:background-color 9999s ease-in-out 0s;
  }
  button { font-family:inherit; cursor:pointer; transition:opacity .12s; }
  button:active { opacity:0.5; }
  .tnum { font-variant-numeric:tabular-nums; }
  .gold { color:#E8B765; }
  .goldgrad { color:#E8B765; background:linear-gradient(135deg,#F6DDA0,#D6A24B); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }

  /* compact nav bar (fades in on scroll) */
  .navbar {
    position:fixed; top:0; left:0; right:0; z-index:70;
    height:calc(env(safe-area-inset-top) + 44px); padding-top:env(safe-area-inset-top);
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.6);
    backdrop-filter:saturate(180%) blur(22px); -webkit-backdrop-filter:saturate(180%) blur(22px);
    border-bottom:0.5px solid rgba(255,255,255,0.08);
    opacity:0; transform:translateY(-1px); transition:opacity .2s; pointer-events:none;
  }
  .navbar.show { opacity:1; }
  .navbar-title { font-size:17px; font-weight:600; }

  .page { display:none; padding:calc(env(safe-area-inset-top) + 4px) 16px 26px; }
  .page.active { display:block; }
  .largetitle { font-size:32px; font-weight:700; letter-spacing:0.3px; padding:6px 2px 16px; }

  /* grouped list */
  .grouplabel { font-size:13px; color:rgba(235,235,245,0.55); margin:24px 8px 7px; font-weight:500; }
  .grouplabel.first { margin-top:2px; }
  .group { background:#1C1C1E; border-radius:16px; overflow:hidden; }
  .cell {
    position:relative; display:flex; align-items:center; justify-content:space-between;
    padding:13px 16px; min-height:54px; transition:background .12s;
  }
  .cell.tap:active { background:#2A2A2C; }
  .cell:not(:first-child)::before { content:""; position:absolute; top:0; left:16px; right:0; height:0.5px; background:#38383A; }
  .cell .nm { font-size:16px; font-weight:500; }
  .cell .sub { font-size:13px; color:rgba(235,235,245,0.55); margin-top:3px; }
  .cell .sub.bonus { color:#E8B765; }
  .cell .chev { color:#48484A; font-size:17px; font-weight:600; margin-left:8px; }

  /* calc employee row */
  .erow-right { display:flex; align-items:center; gap:6px; }
  .erow-amt { font-size:18px; font-weight:700; }

  .addbtn { display:flex; align-items:center; justify-content:center; gap:6px; width:100%; background:#1C1C1E; border:none; border-radius:16px; padding:16px; margin-top:14px; color:#E8B765; font-size:16px; font-weight:600; }

  .empty { text-align:center; padding:64px 24px; }
  .empty .big { font-size:50px; margin-bottom:14px; }
  .empty .t { font-size:17px; color:#FFFFFF; margin-bottom:6px; font-weight:600; }
  .empty .d { font-size:14px; line-height:1.55; color:rgba(235,235,245,0.55); }

  /* bottom summary */
  .summary {
    position:fixed; left:0; right:0; bottom:calc(50px + env(safe-area-inset-bottom)); z-index:55;
    background:rgba(0,0,0,0.7);
    backdrop-filter:saturate(180%) blur(22px); -webkit-backdrop-filter:saturate(180%) blur(22px);
    border-top:0.5px solid rgba(255,255,255,0.08); padding:11px 16px 12px; display:none;
  }
  .summary.show { display:block; }
  .summary-top { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; }
  .summary-top .lbl { font-size:14px; color:rgba(235,235,245,0.6); }
  .summary-top .amt { font-size:26px; font-weight:700; }
  .summary-actions { display:flex; gap:9px; }
  .btn { border:none; border-radius:13px; padding:13px; font-size:16px; font-weight:600; }
  .btn-ghost { flex:0 0 96px; background:#2C2C2E; color:#EBEBF5; }
  .btn-gold { flex:1; background:linear-gradient(135deg,#F4D58E,#D9A94E); color:#1A1200; }

  /* tab bar */
  .tabbar {
    position:fixed; left:0; right:0; bottom:0; z-index:80;
    height:calc(50px + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom);
    background:rgba(0,0,0,0.78);
    backdrop-filter:saturate(180%) blur(22px); -webkit-backdrop-filter:saturate(180%) blur(22px);
    border-top:0.5px solid rgba(255,255,255,0.08); display:flex;
  }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:#7C7C80; font-size:10px; font-weight:500; }
  .tab svg { width:26px; height:26px; }
  .tab.active { color:#E8B765; }

  /* sheet */
  .scrim { position:fixed; inset:0; z-index:90; background:rgba(0,0,0,0.55); opacity:0; pointer-events:none; transition:opacity .28s; }
  .scrim.show { opacity:1; pointer-events:auto; }
  .sheet {
    position:fixed; left:0; right:0; bottom:0; z-index:100; background:#1C1C1E;
    border-radius:14px 14px 0 0; transform:translateY(100%);
    transition:transform .34s cubic-bezier(.32,.72,0,1); max-height:94vh; display:flex; flex-direction:column;
  }
  .sheet.show { transform:translateY(0); }
  .grabber { width:36px; height:5px; border-radius:3px; background:#5A5A5E; margin:8px auto 0; flex:none; }
  .sheet-nav { flex:none; display:flex; align-items:center; justify-content:space-between; padding:12px 16px 10px; min-height:48px; }
  .sheet-nav .sn-side { min-width:64px; }
  .sheet-nav .sn-left { text-align:left; }
  .sheet-nav .sn-right { text-align:right; }
  .sheet-nav button { background:none; border:none; font-size:17px; color:#E8B765; padding:0; }
  .sheet-nav button.bold { font-weight:700; }
  .sheet-nav .sn-title { flex:1; text-align:center; }
  .sheet-nav .sn-title .t { font-size:17px; font-weight:600; }
  .sheet-nav .sn-title .s { font-size:12px; color:rgba(235,235,245,0.55); margin-top:1px; }
  .sheet-scroll { overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 16px 18px; flex:1; }

  .field-label { font-size:13px; color:rgba(235,235,245,0.55); margin:18px 8px 7px; font-weight:500; }
  .field-label.first { margin-top:4px; }
  .fin { display:flex; align-items:center; background:#2C2C2E; border-radius:13px; padding:14px 15px; }
  .fin .pre { color:rgba(235,235,245,0.5); font-size:17px; margin-right:5px; }
  .fin .suf { color:rgba(235,235,245,0.5); font-size:16px; margin-left:5px; }
  .fin input { flex:1; background:transparent; border:none; color:#FFFFFF; font-size:17px; font-weight:500; min-width:0; }
  .fin input.tnum { font-variant-numeric:tabular-nums; }

  .seg { display:flex; background:#0E0E0F; border-radius:11px; padding:3px; }
  .seg button { flex:1; border:none; background:transparent; color:rgba(235,235,245,0.6); font-size:14px; font-weight:600; padding:10px; border-radius:9px; transition:background .15s,color .15s; }
  .seg button.on { background:#5A5A5E; color:#FFFFFF; }

  .delrow { text-align:center; margin:26px 0 6px; }
  .delrow button { background:#1C1C1E; border:none; color:#FF453A; font-size:16px; padding:14px; width:100%; border-radius:16px; font-weight:500; }

  /* calc detail rows */
  .cd-right { display:flex; align-items:center; }
  .stepper { display:flex; align-items:center; background:#0E0E0F; border-radius:11px; overflow:hidden; }
  .stepper button { width:42px; height:38px; border:none; background:transparent; color:#E8B765; font-size:23px; font-weight:300; line-height:1; }
  .stepper .stnum { min-width:34px; text-align:center; font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; position:relative; }
  .stepper .stnum::before { content:""; position:absolute; left:0; top:8px; bottom:8px; width:0.5px; background:#3A3A3C; }
  .stepper .stnum::after { content:""; position:absolute; right:0; top:8px; bottom:8px; width:0.5px; background:#3A3A3C; }
  .stepper .stnum.zero { color:#5A5A5E; }
  .amtbox { display:flex; align-items:center; background:#0E0E0F; border-radius:11px; padding:9px 13px; }
  .amtbox .pre { color:rgba(235,235,245,0.5); font-size:15px; margin-right:3px; }
  .amtbox input { width:92px; background:transparent; border:none; color:#FFFFFF; font-size:16px; font-weight:600; text-align:right; font-variant-numeric:tabular-nums; }

  .sheet-foot { flex:none; padding:13px 16px calc(env(safe-area-inset-bottom) + 14px); border-top:0.5px solid #38383A; background:#1C1C1E; }
  .foot-line { display:flex; align-items:baseline; justify-content:space-between; }
  .foot-break { font-size:13px; color:rgba(235,235,245,0.55); font-variant-numeric:tabular-nums; }
  .foot-total { font-size:27px; font-weight:700; font-variant-numeric:tabular-nums; }

  /* history */
  .hcard { background:#1C1C1E; border-radius:16px; padding:16px 16px 12px; margin-bottom:13px; }
  .hcard-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
  .hdate { font-size:16px; font-weight:600; }
  .htotal { font-size:19px; font-weight:700; }
  .hitem { display:flex; align-items:baseline; justify-content:space-between; padding:8px 0; font-size:14px; border-top:0.5px solid #38383A; }
  .hitem .hn { color:#EBEBF5; }
  .hitem .hd { color:rgba(235,235,245,0.5); font-size:12px; font-variant-numeric:tabular-nums; }
  .hitem .ha { color:#FFFFFF; font-variant-numeric:tabular-nums; font-weight:600; }
  .hdel { text-align:right; margin-top:8px; }
  .hdel button { background:none; border:none; color:rgba(235,235,245,0.5); font-size:13px; }

  .toast { position:fixed; left:50%; bottom:calc(128px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(10px); z-index:130; background:rgba(58,58,60,0.96); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); color:#FFFFFF; padding:13px 24px; border-radius:26px; font-size:14px; font-weight:500; opacity:0; pointer-events:none; transition:all .25s; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="bgfill"></div>

<div class="navbar" id="navbar"><div class="navbar-title" id="navTitle">計算</div></div>

<div class="page active" id="page-calc"><div class="largetitle" id="ltCalc">計算</div><div id="calcList"></div></div>
<div class="page" id="page-emp"><div class="largetitle">従業員</div><div id="empList"></div><button class="addbtn" id="addEmpBtn">＋ 従業員を追加</button></div>
<div class="page" id="page-drink"><div class="largetitle">ドリンク</div><div id="drinkList"></div><button class="addbtn" id="addDrinkBtn">＋ ドリンクを追加</button></div>
<div class="page" id="page-hist"><div class="largetitle">履歴</div><div id="histList"></div></div>

<div class="summary" id="summary">
  <div class="summary-top"><div class="lbl">合計支払額</div><div class="amt goldgrad" id="grandTotal">¥0</div></div>
  <div class="summary-actions">
    <button class="btn btn-ghost" id="resetBtn">クリア</button>
    <button class="btn btn-gold" id="saveBtn">履歴に保存</button>
  </div>
</div>

<div class="tabbar">
  <div class="tab active" data-tab="calc">
    <svg viewBox="0 0 28 28" fill="currentColor"><path d="M7 3.2h14c1.5 0 2.6 1.1 2.6 2.6v16.4c0 1.5-1.1 2.6-2.6 2.6H7c-1.5 0-2.6-1.1-2.6-2.6V5.8C4.4 4.3 5.5 3.2 7 3.2zm1.6 5a1.2 1.2 0 0 0 0 2.4h10.8a1.2 1.2 0 0 0 0-2.4H8.6zm0 5.2a1.2 1.2 0 0 0 0 2.4h10.8a1.2 1.2 0 0 0 0-2.4H8.6zm0 5.2a1.2 1.2 0 0 0 0 2.4h6a1.2 1.2 0 0 0 0-2.4h-6z"/></svg>
    <span>計算</span>
  </div>
  <div class="tab" data-tab="emp">
    <svg viewBox="0 0 28 28" fill="currentColor"><circle cx="11" cy="9.2" r="4"/><path d="M11 14.6c-4.4 0-7.6 2.9-7.6 6.6 0 1 .6 1.6 1.6 1.6h12c1 0 1.6-.6 1.6-1.6 0-3.7-3.2-6.6-7.6-6.6z"/><circle cx="20.3" cy="10" r="3.2"/><path d="M20.3 15c-1 0-1.9.2-2.7.5 1.5 1.4 2.5 3.4 2.7 5.7h4c.9 0 1.4-.5 1.4-1.4 0-2.7-2.3-4.8-5.4-4.8z"/></svg>
    <span>従業員</span>
  </div>
  <div class="tab" data-tab="drink">
    <svg viewBox="0 0 28 28" fill="currentColor"><path d="M5.4 4.5h17.2c.8 0 1.3.9.8 1.5l-7 8.4v6.7h3.3c.7 0 1.2.5 1.2 1.2s-.5 1.2-1.2 1.2H8.3c-.7 0-1.2-.5-1.2-1.2s.5-1.2 1.2-1.2h3.3v-6.7l-7-8.4c-.5-.6 0-1.5.8-1.5z"/></svg>
    <span>ドリンク</span>
  </div>
  <div class="tab" data-tab="hist">
    <svg viewBox="0 0 28 28" fill="currentColor"><path d="M14 3.4C8.1 3.4 3.4 8.1 3.4 14S8.1 24.6 14 24.6 24.6 19.9 24.6 14 19.9 3.4 14 3.4zm.2 4.4c.7 0 1.2.5 1.2 1.2v5l3.5 2.1c.6.3.8 1.1.4 1.7-.3.6-1.1.8-1.6.4l-4.1-2.5c-.4-.2-.6-.6-.6-1V9c0-.7.5-1.2 1.2-1.2z"/></svg>
    <span>履歴</span>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var KEY = "kyuryo_app_v2", OLDKEY = "kyuryo_app_v1";
  var state = { employees:[], drinks:[], today:{}, history:[] };

  var DEFAULT_DRINKS = [
    {name:"リステル", group:"抜き物", kind:"fixed", value:1000},
    {name:"ポンパドール", group:"抜き物", kind:"fixed", value:1000},
    {name:"カフェパ等", group:"抜き物", kind:"fixed", value:1000},
    {name:"モエ白", group:"抜き物", kind:"fixed", value:3000},
    {name:"モエロゼ", group:"抜き物", kind:"fixed", value:4000},
    {name:"ネクター", group:"抜き物", kind:"fixed", value:4000},
    {name:"ネクターロゼ", group:"抜き物", kind:"fixed", value:4000},
    {name:"ドンペリ", group:"％バック", kind:"percent", value:10},
    {name:"ピンドン", group:"％バック", kind:"percent", value:10},
    {name:"アルマンド等", group:"％バック", kind:"percent", value:10},
    {name:"予約バック（セット料金）", group:"％バック", kind:"percent", value:10},
    {name:"テキーラ", group:"ショット", kind:"fixed", value:500},
    {name:"コカボム", group:"ショット", kind:"fixed", value:500},
    {name:"黒霧島", group:"焼酎", kind:"fixed", value:800},
    {name:"壱岐", group:"焼酎", kind:"fixed", value:800},
    {name:"白", group:"焼酎", kind:"fixed", value:800},
    {name:"ウィスキー", group:"その他", kind:"fixed", value:1000},
    {name:"キャストドリンク", group:"ドリンク", kind:"fixed", value:200, bonusEvery:11, bonusAmt:500},
    {name:"ヘルプドリンク", group:"ドリンク", kind:"fixed", value:100},
    {name:"予約の子ドリンク", group:"ドリンク", kind:"fixed", value:100}
  ];

  function load(){
    try {
      var raw = localStorage.getItem(KEY);
      if(raw){
        var d = JSON.parse(raw);
        state.employees = Array.isArray(d.employees)? d.employees : [];
        state.drinks = Array.isArray(d.drinks)? d.drinks : [];
        state.today = d.today || {};
        state.history = Array.isArray(d.history)? d.history : [];
      } else {
        var old = localStorage.getItem(OLDKEY);
        if(old){ try { var o=JSON.parse(old); state.employees=o.employees||[]; state.history=o.history||[]; } catch(e){} }
      }
    } catch(e){}
    if(state.drinks.length===0) state.drinks = DEFAULT_DRINKS.map(function(d){ var c=Object.assign({},d); c.id=uid(); return c; });
  }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

  function yen(n){ return "¥" + Math.round(n).toLocaleString("ja-JP"); }
  function num(v){ var n=parseFloat(String(v==null?"":v).replace(/[^0-9.]/g,"")); return isNaN(n)?0:n; }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function el(id){ return document.getElementById(id); }
  function empById(id){ for(var i=0;i<state.employees.length;i++) if(state.employees[i].id===id) return state.employees[i]; return null; }
  function drinkById(id){ for(var i=0;i<state.drinks.length;i++) if(state.drinks[i].id===id) return state.drinks[i]; return null; }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  var toastTimer;
  function toast(m){ var t=el("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove("show");},1600); }

  function computeEmp(id){
    var emp=empById(id); var t=state.today[id]||{};
    var wagePay=(emp?emp.wage:0)*num(t.hours); var back=0; var entries=t.drinks||{};
    state.drinks.forEach(function(d){
      var v=entries[d.id]; if(v==null||v==="") return;
      if(d.kind==="percent"){ back+=num(v)*(d.value/100); }
      else { var c=Math.round(num(v)); if(c<=0) return; back+=c*d.value; if(d.bonusEvery>0&&d.bonusAmt>0) back+=Math.floor(c/d.bonusEvery)*d.bonusAmt; }
    });
    return { wagePay:wagePay, back:back, total:wagePay+back, emp:emp };
  }
  function groupOrder(){ var seen={},out=[]; state.drinks.forEach(function(d){ var g=d.group||"その他"; if(!seen[g]){seen[g]=1; out.push(g);} }); return out; }

  /* render: calc */
  function renderCalc(){
    var list=el("calcList");
    if(state.employees.length===0){ list.innerHTML='<div class="empty"><div class="big">🍸</div><div class="t">従業員がいません</div><div class="d">「従業員」タブから<br>名前と時給を登録してください</div></div>'; el("summary").classList.remove("show"); return; }
    var html='<div class="group">';
    state.employees.forEach(function(emp){
      var c=computeEmp(emp.id); var t=state.today[emp.id]||{}; var h=num(t.hours);
      var meta=(h>0?(h+"時間 "):"")+(c.back>0?("バック "+yen(c.back)):""); if(!meta) meta="タップして入力";
      html+='<div class="cell tap" data-id="'+emp.id+'"><div><div class="nm">'+escapeHtml(emp.name)+'</div><div class="sub tnum">'+meta+'</div></div>'
        +'<div class="erow-right"><div class="erow-amt '+(c.total>0?'goldgrad':'')+'" style="'+(c.total>0?'':'color:#5A5A5E')+'">'+yen(c.total)+'</div><div class="chev">›</div></div></div>';
    });
    html+='</div>';
    list.innerHTML=html;
    list.querySelectorAll(".cell").forEach(function(c){ c.addEventListener("click", function(){ openCalcDetail(c.getAttribute("data-id")); }); });
    el("summary").classList.add("show"); updateGrand();
  }
  function updateGrand(){ var g=0; state.employees.forEach(function(e){ g+=computeEmp(e.id).total; }); el("grandTotal").textContent=yen(g); }

  /* render: employees */
  function renderEmp(){
    var list=el("empList");
    if(state.employees.length===0){ list.innerHTML='<div class="empty"><div class="big">👥</div><div class="t">まだ登録がありません</div><div class="d">下のボタンから従業員を追加</div></div>'; return; }
    var html='<div class="group">';
    state.employees.forEach(function(e){ html+='<div class="cell tap" data-id="'+e.id+'"><div><div class="nm">'+escapeHtml(e.name)+'</div><div class="sub tnum">時給 '+yen(e.wage)+'</div></div><div class="chev">›</div></div>'; });
    html+='</div>';
    list.innerHTML=html;
    list.querySelectorAll(".cell").forEach(function(r){ r.addEventListener("click", function(){ openEmpEdit(r.getAttribute("data-id")); }); });
  }

  /* render: drinks */
  function renderDrinks(){
    var list=el("drinkList"); var html=""; var first=true;
    groupOrder().forEach(function(g){
      html+='<div class="grouplabel'+(first?' first':'')+'">'+escapeHtml(g)+'</div><div class="group">'; first=false;
      state.drinks.filter(function(d){return (d.group||"その他")===g;}).forEach(function(d){
        var sub=d.kind==="percent"?(d.value+"% バック"):(yen(d.value)+" / 杯"+(d.bonusEvery>0&&d.bonusAmt>0?("　＋"+d.bonusEvery+"杯ごと"+yen(d.bonusAmt)):""));
        html+='<div class="cell tap" data-id="'+d.id+'"><div><div class="nm">'+escapeHtml(d.name)+'</div><div class="sub tnum">'+sub+'</div></div><div class="chev">›</div></div>';
      });
      html+='</div>';
    });
    list.innerHTML=html;
    list.querySelectorAll(".cell").forEach(function(r){ r.addEventListener("click", function(){ openDrinkEdit(r.getAttribute("data-id")); }); });
  }

  /* render: history */
  function renderHist(){
    var list=el("histList");
    if(state.history.length===0){ list.innerHTML='<div class="empty"><div class="big">📋</div><div class="t">履歴がありません</div><div class="d">計算画面で「履歴に保存」すると<br>ここに残ります</div></div>'; return; }
    var html="";
    state.history.forEach(function(h){
      html+='<div class="hcard"><div class="hcard-head"><div class="hdate">'+escapeHtml(h.date)+'</div><div class="htotal goldgrad">'+yen(h.grandTotal)+'</div></div>';
      h.items.forEach(function(it){ html+='<div class="hitem"><div class="hn">'+escapeHtml(it.name)+'</div><div class="hd">'+(it.hours>0?it.hours+'時間 ':'')+'バック'+yen(it.back)+'</div><div class="ha">'+yen(it.total)+'</div></div>'; });
      html+='<div class="hdel"><button data-hid="'+h.id+'">削除</button></div></div>';
    });
    list.innerHTML=html;
    list.querySelectorAll("button[data-hid]").forEach(function(b){ b.addEventListener("click",function(){ var id=b.getAttribute("data-hid"); state.history=state.history.filter(function(x){return x.id!==id;}); save(); renderHist(); }); });
  }

  /* sheet core */
  function openSheet(html){ el("sheet").innerHTML=html; el("scrim").classList.add("show"); el("sheet").classList.add("show"); }
  function closeSheet(){ el("scrim").classList.remove("show"); el("sheet").classList.remove("show"); if(document.activeElement) document.activeElement.blur(); }

  /* employee edit sheet */
  function openEmpEdit(id){
    var emp=id?empById(id):null;
    var html='<div class="grabber"></div>'
      +'<div class="sheet-nav"><button id="snCancel" class="sn-side sn-left">キャンセル</button>'
      +'<div class="sn-title"><div class="t">'+(emp?'従業員を編集':'従業員を追加')+'</div></div>'
      +'<button id="snDone" class="sn-side sn-right bold">'+(emp?'保存':'追加')+'</button></div>'
      +'<div class="sheet-scroll">'
      +'<div class="field-label first">名前</div><div class="fin"><input id="fName" type="text" placeholder="例：あや" autocomplete="off" value="'+(emp?escapeHtml(emp.name):'')+'"></div>'
      +'<div class="field-label">時給</div><div class="fin"><span class="pre">¥</span><input id="fWage" class="tnum" type="text" inputmode="numeric" placeholder="1500" value="'+(emp?emp.wage:'')+'"></div>'
      +(emp?'<div class="delrow"><button id="delBtn">この従業員を削除</button></div>':'')
      +'</div>';
    openSheet(html);
    el("snCancel").addEventListener("click", closeSheet);
    el("snDone").addEventListener("click", function(){
      var name=el("fName").value.trim(), wage=num(el("fWage").value);
      if(!name){ toast("名前を入力してください"); return; }
      if(wage<=0){ toast("時給を入力してください"); return; }
      if(emp){ emp.name=name; emp.wage=wage; } else { state.employees.push({id:uid(),name:name,wage:wage}); }
      save(); closeSheet(); renderEmp(); toast(emp?"保存しました":"追加しました");
    });
    if(emp) el("delBtn").addEventListener("click", function(){ if(!confirm("「"+emp.name+"」を削除しますか？")) return; state.employees=state.employees.filter(function(e){return e.id!==emp.id;}); delete state.today[emp.id]; save(); closeSheet(); renderEmp(); toast("削除しました"); });
  }

  /* drink edit sheet */
  function openDrinkEdit(id){
    var d=id?drinkById(id):null; var kind=d?d.kind:"fixed";
    var html='<div class="grabber"></div>'
      +'<div class="sheet-nav"><button id="snCancel" class="sn-side sn-left">キャンセル</button>'
      +'<div class="sn-title"><div class="t">'+(d?'ドリンクを編集':'ドリンクを追加')+'</div></div>'
      +'<button id="snDone" class="sn-side sn-right bold">'+(d?'保存':'追加')+'</button></div>'
      +'<div class="sheet-scroll">'
      +'<div class="field-label first">名前</div><div class="fin"><input id="dName" type="text" placeholder="例：ドンペリ" autocomplete="off" value="'+(d?escapeHtml(d.name):'')+'"></div>'
      +'<div class="field-label">グループ</div><div class="fin"><input id="dGroup" type="text" placeholder="例：抜き物" autocomplete="off" value="'+(d?escapeHtml(d.group||''):'')+'"></div>'
      +'<div class="field-label">バックの種類</div><div class="seg"><button id="kFixed" class="'+(kind==="fixed"?"on":"")+'">定額（円／杯）</button><button id="kPercent" class="'+(kind==="percent"?"on":"")+'">％（金額×％）</button></div>'
      +'<div id="valFixedWrap" style="'+(kind==="percent"?"display:none":"")+'"><div class="field-label">1杯あたりの金額</div><div class="fin"><span class="pre">¥</span><input id="dValFixed" class="tnum" type="text" inputmode="numeric" placeholder="1000" value="'+(d&&d.kind!=="percent"?d.value:'')+'"></div></div>'
      +'<div id="valPercentWrap" style="'+(kind==="percent"?"":"display:none")+'"><div class="field-label">バック率</div><div class="fin"><input id="dValPercent" class="tnum" type="text" inputmode="numeric" placeholder="10" value="'+(d&&d.kind==="percent"?d.value:'')+'"><span class="suf">%</span></div></div>'
      +'<div id="bonusWrap" style="'+(kind==="percent"?"display:none":"")+'"><div class="field-label">ボーナス（任意）　◯杯ごとに＋◯円</div>'
      +'<div style="display:flex;gap:10px"><div class="fin" style="flex:1"><input id="dBonusEvery" class="tnum" type="text" inputmode="numeric" placeholder="11" value="'+(d&&d.bonusEvery?d.bonusEvery:'')+'"><span class="suf">杯</span></div>'
      +'<div class="fin" style="flex:1"><span class="pre">+¥</span><input id="dBonusAmt" class="tnum" type="text" inputmode="numeric" placeholder="500" value="'+(d&&d.bonusAmt?d.bonusAmt:'')+'"></div></div></div>'
      +(d?'<div class="delrow"><button id="dDel">このドリンクを削除</button></div>':'')
      +'</div>';
    openSheet(html);
    var cur=kind;
    function setKind(k){ cur=k; el("kFixed").classList.toggle("on",k==="fixed"); el("kPercent").classList.toggle("on",k==="percent"); el("valFixedWrap").style.display=k==="fixed"?"":"none"; el("bonusWrap").style.display=k==="fixed"?"":"none"; el("valPercentWrap").style.display=k==="percent"?"":"none"; }
    el("kFixed").addEventListener("click",function(){setKind("fixed");});
    el("kPercent").addEventListener("click",function(){setKind("percent");});
    el("snCancel").addEventListener("click", closeSheet);
    el("snDone").addEventListener("click", function(){
      var name=el("dName").value.trim(); if(!name){ toast("名前を入力してください"); return; }
      var group=el("dGroup").value.trim()||"その他";
      var obj={ id:d?d.id:uid(), name:name, group:group, kind:cur };
      if(cur==="percent"){ obj.value=num(el("dValPercent").value); if(obj.value<=0){ toast("バック率を入力してください"); return; } }
      else { obj.value=num(el("dValFixed").value); if(obj.value<=0){ toast("金額を入力してください"); return; } var be=Math.round(num(el("dBonusEvery").value)),ba=Math.round(num(el("dBonusAmt").value)); if(be>0&&ba>0){ obj.bonusEvery=be; obj.bonusAmt=ba; } }
      if(d){ state.drinks[state.drinks.indexOf(d)]=obj; } else { state.drinks.push(obj); }
      save(); closeSheet(); renderDrinks(); toast(d?"保存しました":"追加しました");
    });
    if(d) el("dDel").addEventListener("click", function(){ if(!confirm("「"+d.name+"」を削除しますか？")) return; state.drinks=state.drinks.filter(function(x){return x.id!==d.id;}); save(); closeSheet(); renderDrinks(); toast("削除しました"); });
  }

  /* calc detail sheet */
  function drinkBack(d, v){
    if(v==null||v==="") return {back:0, label:""};
    if(d.kind==="percent"){ var a=num(v); if(a<=0) return {back:0,label:""}; return {back:a*(d.value/100), label:"売上 "+yen(a)+" ×"+d.value+"%"}; }
    var c=Math.round(num(v)); if(c<=0) return {back:0,label:""};
    var back=c*d.value, lbl=c+"杯 ×"+yen(d.value);
    if(d.bonusEvery>0&&d.bonusAmt>0){ var b=Math.floor(c/d.bonusEvery); if(b>0){ back+=b*d.bonusAmt; lbl+="　＋ボーナス"+yen(b*d.bonusAmt); } }
    return {back:back, label:lbl};
  }

  function openCalcDetail(empId){
    var emp=empById(empId);
    if(!state.today[empId]) state.today[empId]={};
    if(!state.today[empId].drinks) state.today[empId].drinks={};
    var t=state.today[empId];
    var mode="input";

    var html='<div class="grabber"></div>'
      +'<div class="sheet-nav"><div class="sn-side"></div>'
      +'<div class="sn-title"><div class="t">'+escapeHtml(emp.name)+'</div><div class="s">時給 '+yen(emp.wage)+'</div></div>'
      +'<button id="cdDone" class="sn-side sn-right bold">完了</button></div>'
      +'<div style="padding:2px 16px 6px"><div class="seg"><button id="mInput" class="on">入力</button><button id="mSum">集計</button></div></div>'
      +'<div class="sheet-scroll" id="cdScroll"></div>'
      +'<div class="sheet-foot"><div class="foot-line"><div class="foot-break" id="cdBreak"></div><div class="foot-total goldgrad" id="cdTotal">¥0</div></div></div>';
    openSheet(html);

    function refresh(){ var c=computeEmp(empId); el("cdTotal").textContent=yen(c.total); el("cdBreak").textContent="時給 "+yen(c.wagePay)+"　＋　バック "+yen(c.back); save(); }

    function buildInput(){
      var body='<div class="field-label first">勤務時間</div><div class="fin"><input id="cdHours" class="tnum" type="text" inputmode="decimal" placeholder="0" value="'+(t.hours!=null?t.hours:'')+'"><span class="suf">時間</span></div>';
      groupOrder().forEach(function(g){
        body+='<div class="field-label">'+escapeHtml(g)+'</div><div class="group">';
        state.drinks.filter(function(d){return (d.group||"その他")===g;}).forEach(function(d){
          var v=t.drinks[d.id];
          if(d.kind==="percent"){
            body+='<div class="cell"><div><div class="nm">'+escapeHtml(d.name)+'</div><div class="sub">'+d.value+'% バック（売上を入力）</div></div>'
              +'<div class="amtbox"><span class="pre">¥</span><input class="cdAmt" data-did="'+d.id+'" type="text" inputmode="numeric" placeholder="0" value="'+(v!=null&&v!==""?v:'')+'"></div></div>';
          } else {
            var c=Math.round(num(v));
            var note=(d.bonusEvery>0&&d.bonusAmt>0)?'<div class="sub bonus">'+yen(d.value)+' / 杯　'+d.bonusEvery+'杯ごと＋'+yen(d.bonusAmt)+'</div>':'<div class="sub tnum">'+yen(d.value)+' / 杯</div>';
            body+='<div class="cell"><div><div class="nm">'+escapeHtml(d.name)+'</div>'+note+'</div>'
              +'<div class="cd-right"><div class="stepper"><button class="cdMinus" data-did="'+d.id+'">−</button><div class="stnum '+(c>0?'':'zero')+'" id="stnum-'+d.id+'">'+c+'</div><button class="cdPlus" data-did="'+d.id+'">＋</button></div></div></div>';
          }
        });
        body+='</div>';
      });
      el("cdScroll").innerHTML=body;
      el("cdHours").addEventListener("input", function(){ t.hours=el("cdHours").value; refresh(); });
      el("cdScroll").querySelectorAll(".cdAmt").forEach(function(inp){ inp.addEventListener("input", function(){ t.drinks[inp.getAttribute("data-did")]=inp.value; refresh(); }); });
      el("cdScroll").querySelectorAll(".cdPlus").forEach(function(b){ b.addEventListener("click", function(){ var id=b.getAttribute("data-did"); var c=Math.round(num(t.drinks[id]))+1; t.drinks[id]=c; var n=el("stnum-"+id); n.textContent=c; n.classList.remove("zero"); refresh(); }); });
      el("cdScroll").querySelectorAll(".cdMinus").forEach(function(b){ b.addEventListener("click", function(){ var id=b.getAttribute("data-did"); var c=Math.round(num(t.drinks[id]))-1; if(c<0)c=0; t.drinks[id]=c; var n=el("stnum-"+id); n.textContent=c; n.classList.toggle("zero",c===0); refresh(); }); });
    }

    function buildSummary(){
      var c=computeEmp(empId); var h=num(t.hours);
      var rows="";
      if(h>0){
        rows+='<div class="field-label first">給料</div><div class="group">'
          +'<div class="cell"><div><div class="nm">時給</div><div class="sub tnum">'+h+'時間 × '+yen(emp.wage)+'</div></div><div class="erow-amt tnum">'+yen(c.wagePay)+'</div></div></div>';
      }
      var dr="";
      state.drinks.forEach(function(d){
        var r=drinkBack(d, t.drinks[d.id]); if(r.back<=0) return;
        dr+='<div class="cell"><div><div class="nm">'+escapeHtml(d.name)+'</div><div class="sub tnum">'+r.label+'</div></div><div class="erow-amt tnum">'+yen(r.back)+'</div></div>';
      });
      if(dr) rows+='<div class="field-label'+(h>0?'':' first')+'">ドリンクバック</div><div class="group">'+dr+'</div>';
      if(!rows) rows='<div class="empty"><div class="big">📝</div><div class="t">入力がありません</div><div class="d">「入力」タブで<br>勤務時間や杯数を入れてください</div></div>';
      el("cdScroll").innerHTML=rows;
    }

    function setMode(m){
      mode=m;
      el("mInput").classList.toggle("on",m==="input");
      el("mSum").classList.toggle("on",m==="summary");
      if(m==="input") buildInput(); else buildSummary();
      el("cdScroll").scrollTop=0;
    }
    el("mInput").addEventListener("click", function(){ setMode("input"); });
    el("mSum").addEventListener("click", function(){ setMode("summary"); });
    el("cdDone").addEventListener("click", function(){ closeSheet(); renderCalc(); });

    buildInput(); refresh();
  }

  /* tabs */
  var titles={ calc:"計算", emp:"従業員", drink:"ドリンク", hist:"履歴" };
  function switchTab(name){
    document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
    el("page-"+name).classList.add("active");
    document.querySelectorAll(".tab").forEach(function(tb){ tb.classList.toggle("active", tb.getAttribute("data-tab")===name); });
    el("navTitle").textContent=titles[name];
    el("summary").classList.toggle("show", name==="calc" && state.employees.length>0);
    if(name==="calc") renderCalc();
    if(name==="emp") renderEmp();
    if(name==="drink") renderDrinks();
    if(name==="hist") renderHist();
    window.scrollTo(0,0); el("navbar").classList.remove("show");
  }

  function bind(){
    document.querySelectorAll(".tab").forEach(function(tb){ tb.addEventListener("click", function(){ switchTab(tb.getAttribute("data-tab")); }); });
    el("scrim").addEventListener("click", closeSheet);
    el("addEmpBtn").addEventListener("click", function(){ openEmpEdit(null); });
    el("addDrinkBtn").addEventListener("click", function(){ openDrinkEdit(null); });
    el("resetBtn").addEventListener("click", function(){ if(!confirm("入力した勤務時間・杯数をクリアしますか？")) return; state.today={}; save(); renderCalc(); toast("クリアしました"); });
    el("saveBtn").addEventListener("click", function(){
      var items=[],g=0;
      state.employees.forEach(function(e){ var c=computeEmp(e.id); var t=state.today[e.id]||{}; var h=num(t.hours); if(c.total>0){ items.push({name:e.name,hours:h,back:c.back,total:c.total}); g+=c.total; } });
      if(items.length===0){ toast("入力がありません"); return; }
      var now=new Date(); var dstr=(now.getMonth()+1)+"月"+now.getDate()+"日（"+"日月火水木金土".charAt(now.getDay())+"）";
      var existing=null;
      for(var i=0;i<state.history.length;i++){ if(state.history[i].date===dstr){ existing=state.history[i]; break; } }
      if(existing){ existing.items=items; existing.grandTotal=g; }
      else { state.history.unshift({id:uid(),date:dstr,items:items,grandTotal:g}); }
      save(); toast(existing?"本日の履歴を更新しました":"履歴に保存しました");
      switchTab("hist");
    });
    var ticking=false;
    window.addEventListener("scroll", function(){
      if(ticking) return; ticking=true;
      requestAnimationFrame(function(){ el("navbar").classList.toggle("show", window.scrollY>34); ticking=false; });
    }, {passive:true});
  }

  load(); save(); bind(); renderCalc();
})();
</script>
</body>
</html>
