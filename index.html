<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="給料計算">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon-32.png" sizes="32x32">
<title>給料計算</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { color-scheme: dark; }
  html { background:#000000 !important; }
  body {
    background:#000000 !important; color:#FFFFFF; min-height:100dvh; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    -webkit-font-smoothing:antialiased; letter-spacing:0.1px;
    padding-bottom:calc(50px + env(safe-area-inset-bottom));
  }
  #bgfill { position:fixed; inset:0; background:#000000; z-index:-1; }
  input { font-family:inherit; -webkit-appearance:none; appearance:none; background-color:transparent; color:#FFFFFF; -webkit-text-fill-color:#FFFFFF; caret-color:#E8B765; }
  input::placeholder { color:rgba(235,235,245,0.4); -webkit-text-fill-color:rgba(235,235,245,0.4); }
  input:focus { outline:none; }
  input:-webkit-autofill, input:-webkit-autofill:focus {
    -webkit-text-fill-color:#FFFFFF; caret-color:#E8B765;
    transition:background-color 9999s ease-in-out 0s;
  }
  button { font-family:inherit; cursor:pointer; transition:opacity .12s; }
  button:active { opacity:0.5; }
  button:disabled { opacity:1; }
  .tnum { font-variant-numeric:tabular-nums; }
  .gold { color:#E8B765; }
  .goldgrad { color:#E8B765; background:linear-gradient(135deg,#F6DDA0,#D6A24B); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }

  /* compact nav bar (fades in on scroll) */
  .navbar {
    position:fixed; top:0; left:0; right:0; z-index:70;
    height:calc(env(safe-area-inset-top) + 44px); padding-top:env(safe-area-inset-top);
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.6);
    backdrop-filter:saturate(180%) blur(22px); -webkit-backdrop-filter:saturate(180%) blur(22px);
    border-bottom:0.5px solid rgba(255,255,255,0.08);
    opacity:0; transform:translateY(-1px); transition:opacity .2s; pointer-events:none;
  }
  .navbar.show { opacity:1; }
  .navbar-title { font-size:17px; font-weight:600; }

  .page { display:none; padding:calc(env(safe-area-inset-top) + 4px) 16px 26px; }
  .page.active { display:block; }
  .largetitle { font-size:32px; font-weight:700; letter-spacing:0.3px; padding:6px 2px 16px; }

  /* grouped list */
  .grouplabel { font-size:13px; color:rgba(235,235,245,0.55); margin:24px 8px 7px; font-weight:500; }
  .grouplabel.first { margin-top:2px; }
  .glabel-row { display:flex; align-items:center; justify-content:space-between; margin:24px 6px 7px; }
  .glabel-row.first { margin-top:2px; }
  .glabel-row .gname { font-size:15px; color:#FFFFFF; font-weight:600; }
  .group { background:#1C1C1E; border-radius:16px; overflow:hidden; }
  .cell {
    position:relative; display:flex; align-items:center; justify-content:space-between;
    padding:13px 16px; min-height:54px; transition:background .12s;
  }
  .cell.tap:active { background:#2A2A2C; }
  .cell:not(:first-child)::before { content:""; position:absolute; top:0; left:16px; right:0; height:0.5px; background:#38383A; }
  .cell .nm { font-size:16px; font-weight:500; }
  .cell .sub { font-size:13px; color:rgba(235,235,245,0.55); margin-top:3px; }
  .cell .sub.bonus { color:#E8B765; }
  .cell .chev { color:#48484A; font-size:17px; font-weight:600; margin-left:8px; }

  /* calc employee row */
  .erow-right { display:flex; align-items:center; gap:6px; }
  .erow-amt { font-size:18px; font-weight:700; }

  .addbtn { display:flex; align-items:center; justify-content:center; gap:6px; width:100%; background:#1C1C1E; border:none; border-radius:16px; padding:16px; margin-top:14px; color:#E8B765; font-size:16px; font-weight:600; }

  .empty { text-align:center; padding:64px 24px; }
  .empty .big { font-size:50px; margin-bottom:14px; }
  .empty .t { font-size:17px; color:#FFFFFF; margin-bottom:6px; font-weight:600; }
  .empty .d { font-size:14px; line-height:1.55; color:rgba(235,235,245,0.55); }

  /* list controls: search + reorder */
  .listctl { display:flex; gap:9px; align-items:center; margin:2px 2px 6px; }
  .searchbar { flex:1; display:flex; align-items:center; gap:7px; background:#1C1C1E; border-radius:11px; padding:10px 12px; }
  .searchbar svg { width:16px; height:16px; color:rgba(235,235,245,0.4); flex:none; }
  .searchbar input { flex:1; background:transparent; border:none; color:#FFFFFF; font-size:16px; min-width:0; }
  .ctlbtn { flex:none; background:#1C1C1E; border:none; color:#E8B765; font-size:15px; font-weight:600; padding:10px 14px; border-radius:11px; }
  .ctlbtn.on { background:linear-gradient(135deg,#F4D58E,#D9A94E); color:#1A1200; }
  .movebtns { display:flex; gap:7px; }
  .movebtn { width:38px; height:36px; border:none; border-radius:9px; background:#0E0E0F; color:#E8B765; font-size:16px; line-height:1; }
  .movebtn:disabled { color:#48484A; }
  /* business-day date selector */
  .daterow { display:flex; align-items:center; justify-content:space-between; background:#1C1C1E; border-radius:11px; padding:12px 14px; margin:0 2px 8px; }
  .daterow .dlbl { font-size:15px; color:#EBEBF5; font-weight:500; }
  .daterow input[type=date], .fin input[type=date] { background:transparent; border:none; color:#E8B765; -webkit-text-fill-color:#E8B765; font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; }
  .daterow input[type=date] { text-align:right; min-width:0; }
  .fin input[type=date] { flex:1; }

  /* bottom summary */
  .summary {
    position:fixed; left:0; right:0; bottom:calc(50px + env(safe-area-inset-bottom)); z-index:55;
    background:rgba(0,0,0,0.7);
    backdrop-filter:saturate(180%) blur(22px); -webkit-backdrop-filter:saturate(180%) blur(22px);
    border-top:0.5px solid rgba(255,255,255,0.08); padding:11px 16px 12px; display:none;
  }
  .summary.show { display:block; }
  .summary-top { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; }
  .summary-top .lbl { font-size:14px; color:rgba(235,235,245,0.6); }
  .summary-top .amt { font-size:26px; font-weight:700; }
  .summary-actions { display:flex; gap:9px; }
  .btn { border:none; border-radius:13px; padding:13px; font-size:16px; font-weight:600; }
  .btn-ghost { flex:0 0 96px; background:#2C2C2E; color:#EBEBF5; }
  .btn-gold { flex:1; background:linear-gradient(135deg,#F4D58E,#D9A94E); color:#1A1200; }

  /* tab bar */
  .tabbar {
    position:fixed; left:0; right:0; bottom:0; z-index:80;
    height:calc(50px + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom);
    background:rgba(0,0,0,0.78);
    backdrop-filter:saturate(180%) blur(22px); -webkit-backdrop-filter:saturate(180%) blur(22px);
    border-top:0.5px solid rgba(255,255,255,0.08); display:flex;
  }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:#7C7C80; font-size:10px; font-weight:500; }
  .tab svg { width:26px; height:26px; }
  .tab.active { color:#E8B765; }

  /* sheet */
  .scrim { position:fixed; inset:0; z-index:90; background:rgba(0,0,0,0.55); opacity:0; pointer-events:none; transition:opacity .28s; }
  .scrim.show { opacity:1; pointer-events:auto; }
  .sheet {
    position:fixed; left:0; right:0; bottom:0; z-index:100; background:#1C1C1E;
    border-radius:14px 14px 0 0; transform:translateY(100%);
    transition:transform .34s cubic-bezier(.32,.72,0,1); max-height:94vh; display:flex; flex-direction:column;
  }
  .sheet.show { transform:translateY(0); }
  .sheet.full { top:0; max-height:none; height:100dvh; height:100vh; border-radius:0; }
  .sheet.full .sheet-nav { padding-top:calc(env(safe-area-inset-top) + 10px); }
  .grabber { width:36px; height:5px; border-radius:3px; background:#5A5A5E; margin:8px auto 0; flex:none; }
  .sheet-nav { flex:none; display:flex; align-items:center; justify-content:space-between; padding:12px 16px 10px; min-height:48px; }
  .sheet-nav .sn-side { min-width:64px; }
  .sheet-nav .sn-left { text-align:left; }
  .sheet-nav .sn-right { text-align:right; }
  .sheet-nav button { background:none; border:none; font-size:17px; color:#E8B765; padding:0; }
  .sheet-nav button.bold { font-weight:700; }
  .sheet-nav .sn-title { flex:1; text-align:center; }
  .sheet-nav .sn-title .t { font-size:17px; font-weight:600; }
  .sheet-nav .sn-title .s { font-size:12px; color:rgba(235,235,245,0.55); margin-top:1px; }
  .sheet-scroll { overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 16px 18px; flex:1; }

  .field-label { font-size:13px; color:rgba(235,235,245,0.55); margin:18px 8px 7px; font-weight:500; }
  .field-label.first { margin-top:4px; }
  .fin { display:flex; align-items:center; background:#2C2C2E; border-radius:13px; padding:14px 15px; }
  .fin .pre { color:rgba(235,235,245,0.5); font-size:17px; margin-right:5px; }
  .fin .suf { color:rgba(235,235,245,0.5); font-size:16px; margin-left:5px; }
  .fin input { flex:1; background:transparent; border:none; color:#FFFFFF; font-size:17px; font-weight:500; min-width:0; }
  .fin input.tnum { font-variant-numeric:tabular-nums; }

  .seg { display:flex; background:#0E0E0F; border-radius:11px; padding:3px; }
  .seg button { flex:1; border:none; background:transparent; color:rgba(235,235,245,0.6); font-size:14px; font-weight:600; padding:10px; border-radius:9px; transition:background .15s,color .15s; }
  .seg button.on { background:#5A5A5E; color:#FFFFFF; }

  .delrow { text-align:center; margin:26px 0 6px; }
  .delrow button { background:#1C1C1E; border:none; color:#FF453A; font-size:16px; padding:14px; width:100%; border-radius:16px; font-weight:500; }

  /* calc detail rows */
  .cd-right { display:flex; align-items:center; }
  .stepper { display:flex; align-items:center; background:#0E0E0F; border-radius:11px; overflow:hidden; }
  .stepper button { width:42px; height:38px; border:none; background:transparent; color:#E8B765; font-size:23px; font-weight:300; line-height:1; }
  .stepper .stnum { min-width:34px; text-align:center; font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; position:relative; }
  .stepper .stnum::before { content:""; position:absolute; left:0; top:8px; bottom:8px; width:0.5px; background:#3A3A3C; }
  .stepper .stnum::after { content:""; position:absolute; right:0; top:8px; bottom:8px; width:0.5px; background:#3A3A3C; }
  .stepper .stnum.zero { color:#5A5A5E; }
  .stepper input.stcount { width:54px; height:38px; background:transparent; border:none; border-left:0.5px solid #3A3A3C; border-right:0.5px solid #3A3A3C; text-align:center; font-size:17px; font-weight:600; color:#FFFFFF; font-variant-numeric:tabular-nums; }
  .stepper input.stcount.zero { color:#5A5A5E; }
  .amtbox { display:flex; align-items:center; background:#0E0E0F; border-radius:11px; padding:9px 13px; }
  .amtbox .pre { color:rgba(235,235,245,0.5); font-size:15px; margin-right:3px; }
  .amtbox input { width:92px; background:transparent; border:none; color:#FFFFFF; font-size:16px; font-weight:600; text-align:right; font-variant-numeric:tabular-nums; }

  .sheet-foot { flex:none; padding:13px 16px calc(env(safe-area-inset-bottom) + 14px); border-top:0.5px solid #38383A; background:#1C1C1E; }
  .foot-line { display:flex; align-items:baseline; justify-content:space-between; }
  .foot-break { font-size:13px; color:rgba(235,235,245,0.55); font-variant-numeric:tabular-nums; }
  .foot-total { font-size:27px; font-weight:700; font-variant-numeric:tabular-nums; }

  /* history */
  .hcard { background:#1C1C1E; border-radius:16px; padding:16px 16px 12px; margin-bottom:13px; }
  .hcard-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
  .hdate { font-size:16px; font-weight:600; }
  .htotal { font-size:19px; font-weight:700; }
  .hitem { display:flex; align-items:baseline; justify-content:space-between; padding:8px 0; font-size:14px; border-top:0.5px solid #38383A; }
  .hitem .hn { color:#EBEBF5; }
  .hitem .hd { color:rgba(235,235,245,0.5); font-size:12px; font-variant-numeric:tabular-nums; }
  .hitem .ha { color:#FFFFFF; font-variant-numeric:tabular-nums; font-weight:600; }
  .hcard-actions { display:flex; justify-content:flex-end; gap:18px; margin-top:10px; }
  .hcard-actions button { background:none; border:none; color:rgba(235,235,245,0.55); font-size:13px; }
  .hcard-actions button.del { color:rgba(255,69,58,0.85); }
  /* monthly summary */
  .msum-emp { display:flex; align-items:baseline; justify-content:space-between; padding:7px 0; font-size:14px; border-top:0.5px solid #38383A; }
  .msum-emp .n { color:#EBEBF5; }
  .msum-emp .a { color:#FFFFFF; font-variant-numeric:tabular-nums; font-weight:600; }
  .msum-sub { font-size:12px; color:rgba(235,235,245,0.5); }
  /* tappable employee row inside a day card */
  .hrow { position:relative; display:flex; align-items:center; justify-content:space-between; padding:13px 2px; border-top:0.5px solid #38383A; transition:background .12s; border-radius:8px; }
  .hrow:active { background:#2A2A2C; }
  .hrow .hl .nm2 { font-size:16px; font-weight:500; }
  .hrow .hl .sub2 { font-size:12px; color:rgba(235,235,245,0.5); margin-top:2px; font-variant-numeric:tabular-nums; }
  .hrow .hr { display:flex; align-items:center; gap:6px; }
  .hrow .hr .amt2 { font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; }
  .hrow .hr .chev { color:#48484A; font-size:17px; font-weight:600; }

  /* pay slip (給料明細) */
  .payslip { background:linear-gradient(180deg,#15150F,#0C0C0C); border:1px solid #2A2A22; border-radius:18px; padding:22px 20px 24px; margin:8px 0 18px; }
  .ps-brand { text-align:center; font-size:15px; letter-spacing:2px; color:#7BE08A; font-weight:600; margin-bottom:2px; }
  .ps-title { text-align:center; font-size:13px; letter-spacing:6px; color:rgba(235,235,245,0.55); margin-bottom:14px; }
  .ps-meta { display:flex; align-items:baseline; justify-content:space-between; padding-bottom:14px; border-bottom:0.5px solid #38383A; }
  .ps-name { font-size:23px; font-weight:700; }
  .ps-name .sama { font-size:14px; font-weight:500; color:rgba(235,235,245,0.6); margin-left:3px; }
  .ps-date { font-size:13px; color:rgba(235,235,245,0.6); font-variant-numeric:tabular-nums; text-align:right; }
  .ps-rows { padding:6px 0 4px; }
  .ps-row { display:flex; align-items:baseline; justify-content:space-between; padding:11px 0; border-bottom:0.5px solid rgba(255,255,255,0.06); }
  .ps-row .pl { min-width:0; padding-right:12px; }
  .ps-row .pl .pn { font-size:15px; font-weight:500; }
  .ps-row .pl .pd { font-size:12px; color:rgba(235,235,245,0.5); margin-top:2px; font-variant-numeric:tabular-nums; }
  .ps-row .pa { font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .ps-total { display:flex; align-items:baseline; justify-content:space-between; margin-top:16px; padding-top:14px; border-top:1.5px solid #4A4A3A; }
  .ps-total .tl { font-size:16px; font-weight:600; color:rgba(235,235,245,0.85); }
  .ps-total .tv { font-size:32px; font-weight:800; font-variant-numeric:tabular-nums; }
  .ps-note { text-align:center; font-size:12px; color:rgba(235,235,245,0.4); margin-top:14px; }
  .ps-save { display:block; width:100%; border:none; border-radius:14px; padding:16px; margin-top:6px; font-size:17px; font-weight:700; background:linear-gradient(135deg,#8FE8A0,#3FB85A); color:#06210C; }
  .ps-save.saved { background:#2C2C2E; color:#7BE08A; }

  .toast { position:fixed; left:50%; bottom:calc(128px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(10px); z-index:130; background:rgba(58,58,60,0.96); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); color:#FFFFFF; padding:13px 24px; border-radius:26px; font-size:14px; font-weight:500; opacity:0; pointer-events:none; transition:all .25s; max-width:86vw; text-align:center; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="bgfill"></div>

<div class="navbar" id="navbar"><div class="navbar-title" id="navTitle">計算</div></div>

<div class="page active" id="page-calc">
  <div class="largetitle" id="ltCalc">計算</div>
  <div class="listctl" id="calcCtl"><div class="searchbar"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M8.5 2a6.5 6.5 0 0 1 5.07 10.56l3.94 3.93a1 1 0 0 1-1.42 1.42l-3.93-3.94A6.5 6.5 0 1 1 8.5 2zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg><input id="calcSearch" type="text" placeholder="従業員を検索" autocomplete="off"></div></div>
  <div class="daterow" id="calcDateRow"><span class="dlbl">営業日</span><input id="calcDate" type="date"></div>
  <div id="calcList"></div>
</div>
<div class="page" id="page-emp">
  <div class="largetitle">従業員</div>
  <div class="listctl" id="empCtl"><div class="searchbar" id="empSearchBar"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M8.5 2a6.5 6.5 0 0 1 5.07 10.56l3.94 3.93a1 1 0 0 1-1.42 1.42l-3.93-3.94A6.5 6.5 0 1 1 8.5 2zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg><input id="empSearch" type="text" placeholder="名前で検索" autocomplete="off"></div><button class="ctlbtn" id="empSort">並び替え</button></div>
  <div id="empList"></div>
  <button class="addbtn" id="addEmpBtn">＋ 従業員を追加</button>
</div>
<div class="page" id="page-drink">
  <div class="largetitle">ドリンク</div>
  <div class="listctl" id="drinkCtl"><div class="searchbar" id="drinkSearchBar"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M8.5 2a6.5 6.5 0 0 1 5.07 10.56l3.94 3.93a1 1 0 0 1-1.42 1.42l-3.93-3.94A6.5 6.5 0 1 1 8.5 2zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg><input id="drinkSearch" type="text" placeholder="名前・グループで検索" autocomplete="off"></div><button class="ctlbtn" id="drinkSort">並び替え</button></div>
  <div id="drinkList"></div>
  <button class="addbtn" id="addDrinkBtn">＋ ドリンクを追加</button>
</div>
<div class="page" id="page-hist">
  <div class="largetitle">履歴</div>
  <div id="histSummary"></div>
  <div id="histList"></div>
  <div class="grouplabel" id="dataLabel">データ</div>
  <div class="group" id="dataGroup">
    <div class="cell tap" id="btnCSV"><div><div class="nm">CSVで書き出し</div><div class="sub">表計算アプリ用に履歴を出力</div></div><div class="chev">›</div></div>
    <div class="cell tap" id="btnBackup"><div><div class="nm">バックアップ（JSON）</div><div class="sub">全データをファイルに保存</div></div><div class="chev">›</div></div>
    <div class="cell tap" id="btnRestore"><div><div class="nm">バックアップから復元</div><div class="sub">JSONファイルを読み込んで上書き</div></div><div class="chev">›</div></div>
  </div>
  <input type="file" id="restoreFile" accept="application/json,.json" style="display:none">
</div>

<div class="summary" id="summary">
  <div class="summary-top"><div class="lbl">合計支払額</div><div class="amt goldgrad" id="grandTotal">¥0</div></div>
  <div class="summary-actions">
    <button class="btn btn-ghost" id="resetBtn">クリア</button>
    <button class="btn btn-gold" id="saveBtn">履歴に保存</button>
  </div>
</div>

<div class="tabbar">
  <div class="tab active" data-tab="calc">

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var KEY = "kyuryo_app_v2", OLDKEY = "kyuryo_app_v1";
  var state = { employees:[], drinks:[], today:{}, history:[] };
  var currentTab = "calc";
  var empReorder = false, drinkReorder = false;

  var DEFAULT_DRINKS = [
    {name:"キャストドリンク", group:"ドリンク", kind:"fixed", value:200, bonusEvery:11, bonusAmt:500},
    {name:"ヘルプドリンク", group:"ドリンク", kind:"fixed", value:100},
    {name:"予約の子ドリンク", group:"ドリンク", kind:"fixed", value:100},
    {name:"テキーラ", group:"ショット", kind:"fixed", value:500},
    {name:"コカボム", group:"ショット", kind:"fixed", value:500},
    {name:"黒霧島", group:"焼酎", kind:"fixed", value:800},
    {name:"壱岐", group:"焼酎", kind:"fixed", value:800},
    {name:"白", group:"焼酎", kind:"fixed", value:800},
    {name:"ウィスキー", group:"その他", kind:"fixed", value:1000},
    {name:"リステル", group:"抜き物", kind:"fixed", value:1000},
    {name:"ポンパドール", group:"抜き物", kind:"fixed", value:1000},
    {name:"カフェパ等", group:"抜き物", kind:"fixed", value:1000},
    {name:"モエ白", group:"抜き物", kind:"fixed", value:3000},
    {name:"モエロゼ", group:"抜き物", kind:"fixed", value:4000},
    {name:"ネクター", group:"抜き物", kind:"fixed", value:4000},
    {name:"ネクターロゼ", group:"抜き物", kind:"fixed", value:4000},
    {name:"ドンペリ", group:"％バック", kind:"percent", value:10},
    {name:"ピンドン", group:"％バック", kind:"percent", value:10},
    {name:"アルマンド等", group:"％バック", kind:"percent", value:10},
    {name:"予約バック（セット料金）", group:"％バック", kind:"percent", value:10}
  ];
  var GROUP_ORDER_V1 = ["ドリンク","ショット","焼酎","その他","抜き物","％バック"];

  function load(){
    try {
      var raw = localStorage.getItem(KEY);
      if(raw){
        var d = JSON.parse(raw);
        state.employees = Array.isArray(d.employees)? d.employees : [];
        state.drinks = Array.isArray(d.drinks)? d.drinks : [];
        state.today = d.today || {};
        state.history = Array.isArray(d.history)? d.history : [];
      } else {
        var old = localStorage.getItem(OLDKEY);
        if(old){ try { var o=JSON.parse(old); state.employees=o.employees||[]; state.history=o.history||[]; } catch(e){} }
      }
    } catch(e){}
    if(state.drinks.length===0) state.drinks = DEFAULT_DRINKS.map(function(d){ var c=Object.assign({},d); c.id=uid(); return c; });
    state.workDate = todayYMD();
    reorderGroupsOnce();
    migrateHistory();
  }
  /* one-time: arrange drink groups into the requested order (within-group order kept) */
  function reorderGroupsOnce(){
    if(state.groupOrderV1) return;
    var groups=groupOrder();
    var ordered=GROUP_ORDER_V1.filter(function(g){ return groups.indexOf(g)!==-1; });
    groups.forEach(function(g){ if(ordered.indexOf(g)===-1) ordered.push(g); });
    var out=[];
    ordered.forEach(function(g){ state.drinks.forEach(function(d){ if((d.group||"その他")===g) out.push(d); }); });
    state.drinks=out;
    state.groupOrderV1=true;
  }
  function pad2(x){ return (x<10?"0":"")+x; }
  function todayYMD(){ var n=new Date(); return n.getFullYear()+"-"+pad2(n.getMonth()+1)+"-"+pad2(n.getDate()); }
  function workDateObj(){ var s=state.workDate; if(s && /^\d{4}-\d{2}-\d{2}$/.test(s)){ var p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2], 12, 0, 0); } return new Date(); }
  /* convert legacy day-records ({date,items:[...]}) into per-employee records */
  function migrateHistory(){
    var out=[], changed=false;
    state.history.forEach(function(h){
      if(h && h.items && !h.empId){
        changed=true;
        h.items.forEach(function(it){
          out.push({ id:uid(), ts:h.ts||Date.now(), date:h.date, empId:it.empId||("legacy_"+it.name), name:it.name, wage:it.wage||0, hours:it.hours||0, wagePay:(it.total||0)-(it.back||0), back:it.back||0, total:it.total||0, lines:it.lines||[] });
        });
      } else { out.push(h); }
    });
    if(changed) state.history=out;
  }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

  function yen(n){ return "¥" + Math.round(n).toLocaleString("ja-JP"); }
  function num(v){ var n=parseFloat(String(v==null?"":v).replace(/[^0-9.]/g,"")); return isNaN(n)?0:n; }
  function fmtInt(v){ var n=Math.round(num(v)); return n? n.toLocaleString("en-US"):""; }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function el(id){ return document.getElementById(id); }
  function empById(id){ for(var i=0;i<state.employees.length;i++) if(state.employees[i].id===id) return state.employees[i]; return null; }
  function drinkById(id){ for(var i=0;i<state.drinks.length;i++) if(state.drinks[i].id===id) return state.drinks[i]; return null; }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  var toastTimer;
  function toast(m){ var t=el("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove("show");},1700); }

  /* live thousands-separator formatting for integer inputs, caret-preserving */
  function commaInput(input){
    if(!input) return;
    input.addEventListener("input", function(){
      var start = input.selectionStart;
      var raw = input.value;
      var digitsBefore = raw.slice(0, start).replace(/[^0-9]/g,"").length;
      var digits = raw.replace(/[^0-9]/g,"");
      if(digits===""){ input.value=""; return; }
      var formatted = parseInt(digits,10).toLocaleString("en-US");
      input.value = formatted;
      var pos=0, seen=0;
      while(pos < formatted.length && seen < digitsBefore){ if(formatted.charCodeAt(pos)>=48 && formatted.charCodeAt(pos)<=57) seen++; pos++; }
      try { input.setSelectionRange(pos, pos); } catch(e){}
    });
  }

  function computeEmp(id){
    var emp=empById(id); var t=state.today[id]||{};
    var wagePay=(emp?emp.wage:0)*num(t.hours); var back=0; var entries=t.drinks||{};
    state.drinks.forEach(function(d){
      var v=entries[d.id]; if(v==null||v==="") return;
      if(d.kind==="percent"){ back+=num(v)*(d.value/100); }
      else { var c=Math.round(num(v)); if(c<=0) return; back+=c*d.value; if(d.bonusEvery>0&&d.bonusAmt>0) back+=Math.floor(c/d.bonusEvery)*d.bonusAmt; }
    });
    return { wagePay:wagePay, back:back, total:wagePay+back, emp:emp };
  }
  function groupOrder(){ var seen={},out=[]; state.drinks.forEach(function(d){ var g=d.group||"その他"; if(!seen[g]){seen[g]=1; out.push(g);} }); return out; }

  function noResult(){ return '<div class="empty"><div class="big">🔍</div><div class="t">見つかりません</div><div class="d">別のキーワードで<br>お試しください</div></div>'; }

  /* render: calc */
  function renderCalc(){
    var list=el("calcList");
    var q=(el("calcSearch").value||"").trim().toLowerCase();
    if(state.employees.length===0){ el("calcCtl").style.display="none"; el("calcDateRow").style.display="none"; list.innerHTML='<div class="empty"><div class="big">🍸</div><div class="t">従業員がいません</div><div class="d">「従業員」タブから<br>名前と時給を登録してください</div></div>'; el("summary").classList.remove("show"); return; }
    el("calcCtl").style.display="flex";
    el("calcDateRow").style.display="flex"; el("calcDate").value=state.workDate||"";
    var emps=state.employees.filter(function(e){ return !q || e.name.toLowerCase().indexOf(q)!==-1; });
    if(emps.length===0){ list.innerHTML=noResult(); }
    else {
      var html='<div class="group">';
      emps.forEach(function(emp){
        var c=computeEmp(emp.id); var t=state.today[emp.id]||{}; var h=num(t.hours);
        var meta=(h>0?(h+"時間 "):"")+(c.back>0?("バック "+yen(c.back)):""); if(!meta) meta="タップして入力";
        html+='<div class="cell tap" data-id="'+emp.id+'"><div><div class="nm">'+escapeHtml(emp.name)+'</div><div class="sub tnum">'+meta+'</div></div>'
          +'<div class="erow-right"><div class="erow-amt '+(c.total>0?'goldgrad':'')+'" style="'+(c.total>0?'':'color:#5A5A5E')+'">'+yen(c.total)+'</div><div class="chev">›</div></div></div>';
      });
      html+='</div>';
      list.innerHTML=html;
      list.querySelectorAll(".cell").forEach(function(c){ c.addEventListener("click", function(){ openCalcDetail(c.getAttribute("data-id")); }); });
    }
    el("summary").classList.add("show"); updateGrand();
  }
  function updateGrand(){ var g=0; state.employees.forEach(function(e){ g+=computeEmp(e.id).total; }); el("grandTotal").textContent=yen(g); }

  /* render: employees */
  function renderEmp(){
    var list=el("empList");
    if(state.employees.length===0){
      el("empCtl").style.display="none"; empReorder=false; el("empSort").classList.remove("on"); el("empSort").textContent="並び替え";
      list.innerHTML='<div class="empty"><div class="big">👥</div><div class="t">まだ登録がありません</div><div class="d">下のボタンから従業員を追加</div></div>'; return;
    }
    el("empCtl").style.display="flex";
    el("empSearchBar").style.display=empReorder?"none":"flex";
    var q=empReorder?"":(el("empSearch").value||"").trim().toLowerCase();
    var items=state.employees.filter(function(e){ return !q || e.name.toLowerCase().indexOf(q)!==-1; });
    if(items.length===0){ list.innerHTML=noResult(); return; }
    var n=state.employees.length;
    var html='<div class="group">';
    items.forEach(function(e){
      if(empReorder){
        var idx=state.employees.indexOf(e);
        html+='<div class="cell"><div><div class="nm">'+escapeHtml(e.name)+'</div><div class="sub tnum">時給 '+yen(e.wage)+'</div></div>'
          +'<div class="movebtns"><button class="movebtn mUp" data-id="'+e.id+'"'+(idx===0?' disabled':'')+'>↑</button><button class="movebtn mDn" data-id="'+e.id+'"'+(idx===n-1?' disabled':'')+'>↓</button></div></div>';
      } else {
        html+='<div class="cell tap" data-id="'+e.id+'"><div><div class="nm">'+escapeHtml(e.name)+'</div><div class="sub tnum">時給 '+yen(e.wage)+'</div></div><div class="chev">›</div></div>';
      }
    });
    html+='</div>';
    list.innerHTML=html;
    if(empReorder){
      list.querySelectorAll(".mUp").forEach(function(b){ b.addEventListener("click",function(){ moveEmp(b.getAttribute("data-id"),-1); }); });
      list.querySelectorAll(".mDn").forEach(function(b){ b.addEventListener("click",function(){ moveEmp(b.getAttribute("data-id"),1); }); });
    } else {
      list.querySelectorAll(".cell").forEach(function(r){ r.addEventListener("click", function(){ openEmpEdit(r.getAttribute("data-id")); }); });
    }
  }
  function moveEmp(id,dir){
    var i=-1; for(var k=0;k<state.employees.length;k++) if(state.employees[k].id===id){ i=k; break; }
    var j=i+dir; if(i<0||j<0||j>=state.employees.length) return;
    var tmp=state.employees[i]; state.employees[i]=state.employees[j]; state.employees[j]=tmp;
    save(); renderEmp();
  }

  /* render: drinks */
  function renderDrinks(){
    var list=el("drinkList");
    if(state.drinks.length===0){ el("drinkCtl").style.display="none"; list.innerHTML='<div class="empty"><div class="big">🥃</div><div class="t">ドリンクがありません</div><div class="d">下のボタンから追加</div></div>'; return; }
    el("drinkCtl").style.display="flex";
    el("drinkSearchBar").style.display=drinkReorder?"none":"flex";
    var q=drinkReorder?"":(el("drinkSearch").value||"").trim().toLowerCase();
    var html="", first=true, any=false;
    var gOrder=groupOrder();
    gOrder.forEach(function(g,gi){
      var arr=state.drinks.filter(function(d){
        if((d.group||"その他")!==g) return false;
        if(!q) return true;
        return d.name.toLowerCase().indexOf(q)!==-1 || g.toLowerCase().indexOf(q)!==-1;
      });
      if(arr.length===0) return;
      any=true;
      if(drinkReorder){
        html+='<div class="glabel-row'+(first?' first':'')+'"><div class="gname">'+escapeHtml(g)+'</div>'
          +'<div class="movebtns"><button class="movebtn gUp" data-gi="'+gi+'"'+(gi===0?' disabled':'')+'>↑</button><button class="movebtn gDn" data-gi="'+gi+'"'+(gi===gOrder.length-1?' disabled':'')+'>↓</button></div></div><div class="group">';
      } else {
        html+='<div class="grouplabel'+(first?' first':'')+'">'+escapeHtml(g)+'</div><div class="group">';
      }
      first=false;
      arr.forEach(function(d,i){
        var sub=d.kind==="percent"?(d.value+"% バック"):(yen(d.value)+" / 杯"+(d.bonusEvery>0&&d.bonusAmt>0?("　＋"+d.bonusEvery+"杯ごと"+yen(d.bonusAmt)):""));
        if(drinkReorder){
          html+='<div class="cell"><div><div class="nm">'+escapeHtml(d.name)+'</div><div class="sub tnum">'+sub+'</div></div>'
            +'<div class="movebtns"><button class="movebtn dUp" data-id="'+d.id+'"'+(i===0?' disabled':'')+'>↑</button><button class="movebtn dDn" data-id="'+d.id+'"'+(i===arr.length-1?' disabled':'')+'>↓</button></div></div>';
        } else {
          html+='<div class="cell tap" data-id="'+d.id+'"><div><div class="nm">'+escapeHtml(d.name)+'</div><div class="sub tnum">'+sub+'</div></div><div class="chev">›</div></div>';
        }
      });
      html+='</div>';
    });
    if(!any) html=noResult();
    list.innerHTML=html;
    if(drinkReorder){
      list.querySelectorAll(".dUp").forEach(function(b){ b.addEventListener("click",function(){ moveDrink(b.getAttribute("data-id"),-1); }); });
      list.querySelectorAll(".dDn").forEach(function(b){ b.addEventListener("click",function(){ moveDrink(b.getAttribute("data-id"),1); }); });
      list.querySelectorAll(".gUp").forEach(function(b){ b.addEventListener("click",function(){ var go=groupOrder(); moveGroup(go[+b.getAttribute("data-gi")],-1); }); });
      list.querySelectorAll(".gDn").forEach(function(b){ b.addEventListener("click",function(){ var go=groupOrder(); moveGroup(go[+b.getAttribute("data-gi")],1); }); });
    } else {
      list.querySelectorAll(".cell").forEach(function(r){ r.addEventListener("click", function(){ openDrinkEdit(r.getAttribute("data-id")); }); });
    }
  }
  function moveDrink(id,dir){
    var d=drinkById(id); if(!d) return; var g=d.group||"その他";
    var idxs=[]; state.drinks.forEach(function(x,i){ if((x.group||"その他")===g) idxs.push(i); });
    var pos=idxs.indexOf(state.drinks.indexOf(d)); var target=pos+dir;
    if(target<0||target>=idxs.length) return;
    var a=idxs[pos], b=idxs[target];
    var tmp=state.drinks[a]; state.drinks[a]=state.drinks[b]; state.drinks[b]=tmp;
    save(); renderDrinks();
  }
  function moveGroup(name,dir){
    if(name==null) return;
    var order=groupOrder(); var i=order.indexOf(name); var j=i+dir;
    if(i<0||j<0||j>=order.length) return;
    var tmp=order[i]; order[i]=order[j]; order[j]=tmp;
    var out=[]; order.forEach(function(g){ state.drinks.forEach(function(d){ if((d.group||"その他")===g) out.push(d); }); });
    state.drinks=out; state.groupOrderV1=true; save(); renderDrinks();
  }

  /* render: history + monthly summary */
  function monthKey(h){
    if(h.ts){ var d=new Date(h.ts); return d.getFullYear()+"-"+(d.getMonth()+1); }
    var m=/(\d+)\s*月/.exec(h.date||""); if(m) return (new Date().getFullYear())+"-"+parseInt(m[1],10);
    return "0-0";
  }
  function cmpKey(k){ var p=k.split("-"); return (parseInt(p[0],10)||0)*100 + (parseInt(p[1],10)||0); }
  function monthLabel(k){ if(k==="0-0") return "日付不明"; var p=k.split("-"); return p[0]+"年"+p[1]+"月"; }

  function renderHistSummary(){
    var box=el("histSummary");
    if(state.history.length===0){ box.innerHTML=""; return; }
    var groups={}, order=[];
    state.history.forEach(function(h){
      var k=monthKey(h);
      if(!groups[k]){ groups[k]={total:0, days:{}, dayCount:0, emps:{}, empOrder:[]}; order.push(k); }
      var grp=groups[k]; grp.total+=h.total||0;
      if(!grp.days[h.date]){ grp.days[h.date]=1; grp.dayCount++; }
      if(grp.emps[h.name]==null){ grp.emps[h.name]=0; grp.empOrder.push(h.name); }
      grp.emps[h.name]+=h.total||0;
    });
    order.sort(function(a,b){ return cmpKey(b)-cmpKey(a); });
    var html='<div class="grouplabel first">集計</div>';
    order.forEach(function(k){
      var g=groups[k];
      html+='<div class="hcard"><div class="hcard-head"><div><div class="hdate">'+escapeHtml(monthLabel(k))+'</div><div class="msum-sub">'+g.dayCount+'日分</div></div><div class="htotal goldgrad">'+yen(g.total)+'</div></div>';
      g.empOrder.forEach(function(nm){ html+='<div class="msum-emp"><div class="n">'+escapeHtml(nm)+'</div><div class="a tnum">'+yen(g.emps[nm])+'</div></div>'; });
      html+='</div>';
    });
    box.innerHTML=html;
  }

  function renderHist(){
    var list=el("histList");
    if(state.history.length===0){ list.innerHTML='<div class="empty"><div class="big">📋</div><div class="t">履歴がありません</div><div class="d">計算画面で明細を「保存」すると<br>ここに残ります</div></div>'; return; }
    var recs=state.history.slice().sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
    var groups={}, order=[];
    recs.forEach(function(r){ var k=r.date||"—"; if(!groups[k]){ groups[k]={recs:[], total:0}; order.push(k); } groups[k].recs.push(r); groups[k].total+=r.total||0; });
    var html="";
    order.forEach(function(k){
      var g=groups[k];
      html+='<div class="hcard"><div class="hcard-head"><div class="hdate">'+escapeHtml(k)+'</div><div class="htotal goldgrad">'+yen(g.total)+'</div></div>';
      g.recs.forEach(function(r){
        var sub=(r.hours>0?r.hours+'時間':'')+((r.hours>0&&r.back>0)?' / ':'')+(r.back>0?'バック'+yen(r.back):'');
        html+='<div class="hrow tap" data-rec="'+r.id+'"><div class="hl"><div class="nm2">'+escapeHtml(r.name)+'</div>'+(sub?'<div class="sub2">'+sub+'</div>':'')+'</div>'
          +'<div class="hr"><div class="amt2 goldgrad">'+yen(r.total)+'</div><div class="chev">›</div></div></div>';
      });
      html+='</div>';
    });
    list.innerHTML=html;
    list.querySelectorAll(".hrow").forEach(function(r){ r.addEventListener("click", function(){ openHistDetail(r.getAttribute("data-rec")); }); });
  }
  function histText(r){
    var lines=["【給料明細】"+(r.name?(" "+r.name+" 様"):""), fullDate(r), ""];
    if(r.hours>0) lines.push("時給 "+r.hours+"時間 × "+yen(r.wage)+" = "+yen(r.wagePay));
    (r.lines||[]).forEach(function(l){ lines.push(l.name+" "+(l.label||"")+" = "+yen(l.amt)); });
    lines.push("", "合計 "+yen(r.total));
    return lines.join("\n");
  }

  /* clipboard + download + import/export */
  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast("コピーしました"); }, function(){ fallbackCopy(text); });
    } else { fallbackCopy(text); }
  }
  function fallbackCopy(text){
    var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.top="-1000px"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand("copy"); toast("コピーしました"); } catch(e){ toast("コピーできませんでした"); }
    ta.remove();
  }
  function download(filename, text, mime){
    try {
      var blob=new Blob([text],{type:mime||"text/plain;charset=utf-8"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a"); a.href=url; a.download=filename; a.rel="noopener";
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
      return true;
    } catch(e){ return false; }
  }
  function ymd(){ var n=new Date(); function p(x){ return (x<10?"0":"")+x; } return ""+n.getFullYear()+p(n.getMonth()+1)+p(n.getDate()); }
  function csvCell(v){ v=String(v==null?"":v); return /[",\n\r]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }
  function exportCSV(){
    if(state.history.length===0){ toast("履歴がありません"); return; }
    var rows=[["日付","従業員","勤務時間","時給分","バック","合計"]];
    state.history.slice().sort(function(a,b){return (a.ts||0)-(b.ts||0);}).forEach(function(r){ rows.push([r.date, r.name, (r.hours||0), Math.round(r.wagePay||0), Math.round(r.back||0), Math.round(r.total||0)]); });
    var csv=rows.map(function(r){ return r.map(csvCell).join(","); }).join("\r\n");
    if(download("kyuryo_"+ymd()+".csv", "﻿"+csv, "text/csv;charset=utf-8")) toast("CSVを書き出しました"); else copyText(csv);
  }
  function exportJSON(){
    if(download("kyuryo_backup_"+ymd()+".json", JSON.stringify(state), "application/json")) toast("バックアップを保存しました"); else copyText(JSON.stringify(state));
  }
  function importJSON(file){
    var r=new FileReader();
    r.onload=function(){
      var d;
      try { d=JSON.parse(r.result); } catch(e){ toast("ファイルを読み込めませんでした"); return; }
      if(!d || typeof d!=="object" || !("employees" in d || "drinks" in d || "history" in d)){ toast("対応していないファイルです"); return; }
      if(!confirm("現在のデータを上書きして復元しますか？")) return;
      state.employees = Array.isArray(d.employees)? d.employees : [];
      state.drinks = (Array.isArray(d.drinks) && d.drinks.length)? d.drinks : state.drinks;
      state.today = (d.today && typeof d.today==="object")? d.today : {};
      state.history = Array.isArray(d.history)? d.history : [];
      migrateHistory();
      save(); renderAll(); toast("復元しました");
    };
    r.onerror=function(){ toast("ファイルを読み込めませんでした"); };
    r.readAsText(file);
  }

  function renderAll(){
    renderCalc(); renderEmp(); renderDrinks(); renderHistSummary(); renderHist();
    el("summary").classList.toggle("show", currentTab==="calc" && state.employees.length>0);
  }

  /* calc detail sheet */
  function drinkBack(d, v){
    if(v==null||v==="") return {back:0, label:""};
    if(d.kind==="percent"){ var a=num(v); if(a<=0) return {back:0,label:""}; return {back:a*(d.value/100), label:"売上 "+yen(a)+" ×"+d.value+"%"}; }
    var c=Math.round(num(v)); if(c<=0) return {back:0,label:""};
    var back=c*d.value, lbl=c+"杯 ×"+yen(d.value);
    if(d.bonusEvery>0&&d.bonusAmt>0){ var b=Math.floor(c/d.bonusEvery); if(b>0){ back+=b*d.bonusAmt; lbl+="　＋ボーナス"+yen(b*d.bonusAmt); } }
    return {back:back, label:lbl};
  }

  /* per-employee history records (pay slips) */
  var WD="日月火水木金土";
  function dateStr(d){ return (d.getMonth()+1)+"月"+d.getDate()+"日（"+WD.charAt(d.getDay())+"）"; }
  function fullDate(rec){ if(rec.ts){ var d=new Date(rec.ts); return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日（"+WD.charAt(d.getDay())+"）"; } return rec.date||""; }
  function buildRecord(empId){
    var emp=empById(empId); var t=state.today[empId]||{}; var h=num(t.hours); var c=computeEmp(empId);
    var lines=[];
    state.drinks.forEach(function(d){ var r=drinkBack(d, t.drinks?t.drinks[d.id]:null); if(r.back>0) lines.push({name:d.name,label:r.label,amt:r.back}); });
    var d=workDateObj();
    return { id:uid(), ts:d.getTime(), date:dateStr(d), empId:empId, name:emp.name, wage:emp.wage, hours:h, wagePay:c.wagePay, back:c.back, total:c.total, lines:lines };
  }
  function upsertRecord(rec){
    for(var i=0;i<state.history.length;i++){ var x=state.history[i]; if(x.date===rec.date && x.empId===rec.empId){ rec.id=x.id; state.history[i]=rec; return false; } }
    state.history.unshift(rec); return true;
  }
  function payslipHTML(rec){
    var rows="";
    if(rec.hours>0) rows+='<div class="ps-row"><div class="pl"><div class="pn">時給</div><div class="pd">'+rec.hours+'時間 × '+yen(rec.wage)+'</div></div><div class="pa">'+yen(rec.wagePay)+'</div></div>';
    (rec.lines||[]).forEach(function(l){ rows+='<div class="ps-row"><div class="pl"><div class="pn">'+escapeHtml(l.name)+'</div><div class="pd">'+escapeHtml(l.label||"")+'</div></div><div class="pa">'+yen(l.amt)+'</div></div>'; });
    if(!rows) rows='<div class="ps-row"><div class="pl"><div class="pn" style="color:rgba(235,235,245,0.5)">入力がありません</div></div><div class="pa"></div></div>';
    return '<div class="payslip">'
      +'<div class="ps-brand">Baccarat</div><div class="ps-title">給 料 明 細</div>'
      +'<div class="ps-meta"><div class="ps-name">'+escapeHtml(rec.name)+'<span class="sama">様</span></div><div class="ps-date">'+escapeHtml(fullDate(rec))+'</div></div>'
      +'<div class="ps-rows">'+rows+'</div>'
      +'<div class="ps-total"><div class="tl">合計支給額</div><div class="tv goldgrad">'+yen(rec.total)+'</div></div>'
      +'</div>';
  }

  function openCalcDetail(empId){
    var emp=empById(empId);
    if(!state.today[empId]) state.today[empId]={};
    if(!state.today[empId].drinks) state.today[empId].drinks={};
    var t=state.today[empId];
    var mode="input";

    var html='<div class="sheet-nav"><button id="cdClose" class="sn-side sn-left">閉じる</button>'
      +'<div class="sn-title"><div class="t">'+escapeHtml(emp.name)+'</div><div class="s">時給 '+yen(emp.wage)+'</div></div>'
      +'<div class="sn-side"></div></div>'
      +'<div style="padding:2px 16px 6px"><div class="seg"><button id="mInput" class="on">入力</button><button id="mSum">集計（明細）</button></div></div>'
      +'<div class="sheet-scroll" id="cdScroll"></div>'
      +'<div class="sheet-foot" id="cdFoot"><div class="foot-line"><div class="foot-break" id="cdBreak"></div><div class="foot-total goldgrad" id="cdTotal">¥0</div></div></div>';
    openSheet(html, true);

    function refresh(){ var c=computeEmp(empId); el("cdTotal").textContent=yen(c.total); el("cdBreak").textContent="時給 "+yen(c.wagePay)+"　＋　バック "+yen(c.back); save(); }

    function buildInput(){
      var body='<div class="field-label first">営業日</div><div class="fin"><input id="cdDate" type="date" value="'+(state.workDate||'')+'"></div>'
        +'<div class="field-label">勤務時間</div><div class="fin"><input id="cdHours" class="tnum" type="text" inputmode="decimal" placeholder="0" value="'+(t.hours!=null?t.hours:'')+'"><span class="suf">時間</span></div>';
      groupOrder().forEach(function(g){
        body+='<div class="field-label">'+escapeHtml(g)+'</div><div class="group">';
        state.drinks.filter(function(d){return (d.group||"その他")===g;}).forEach(function(d){
          var v=t.drinks[d.id];
          if(d.kind==="percent"){
            body+='<div class="cell"><div><div class="nm">'+escapeHtml(d.name)+'</div><div class="sub">'+d.value+'% バック（売上を入力）</div></div>'
              +'<div class="amtbox"><span class="pre">¥</span><input class="cdAmt" data-did="'+d.id+'" type="text" inputmode="numeric" placeholder="0" value="'+(v!=null&&v!==""?fmtInt(v):'')+'"></div></div>';
          } else {
            var c=Math.round(num(v));
            var note=(d.bonusEvery>0&&d.bonusAmt>0)?'<div class="sub bonus">'+yen(d.value)+' / 杯　'+d.bonusEvery+'杯ごと＋'+yen(d.bonusAmt)+'</div>':'<div class="sub tnum">'+yen(d.value)+' / 杯</div>';
            body+='<div class="cell"><div><div class="nm">'+escapeHtml(d.name)+'</div>'+note+'</div>'
              +'<div class="cd-right"><div class="stepper"><button class="cdMinus" data-did="'+d.id+'">−</button><input class="stcount '+(c>0?'':'zero')+'" id="stnum-'+d.id+'" data-did="'+d.id+'" type="text" inputmode="numeric" value="'+c+'"><button class="cdPlus" data-did="'+d.id+'">＋</button></div></div></div>';
          }
        });
        body+='</div>';
      });
      el("cdScroll").innerHTML=body;
      el("cdDate").addEventListener("change", function(){ if(el("cdDate").value){ state.workDate=el("cdDate").value; save(); } });
      el("cdHours").addEventListener("input", function(){ t.hours=el("cdHours").value; refresh(); });
      el("cdScroll").querySelectorAll(".cdAmt").forEach(function(inp){ commaInput(inp); inp.addEventListener("input", function(){ t.drinks[inp.getAttribute("data-did")]=inp.value; refresh(); }); });
      el("cdScroll").querySelectorAll(".cdPlus").forEach(function(b){ b.addEventListener("click", function(){ var id=b.getAttribute("data-did"); var c=Math.round(num(t.drinks[id]))+1; t.drinks[id]=c; var n=el("stnum-"+id); n.value=c; n.classList.remove("zero"); refresh(); }); });
      el("cdScroll").querySelectorAll(".cdMinus").forEach(function(b){ b.addEventListener("click", function(){ var id=b.getAttribute("data-did"); var c=Math.round(num(t.drinks[id]))-1; if(c<0)c=0; t.drinks[id]=c; var n=el("stnum-"+id); n.value=c; n.classList.toggle("zero",c===0); refresh(); }); });
      el("cdScroll").querySelectorAll(".stcount").forEach(function(inp){
        inp.addEventListener("input", function(){ var id=inp.getAttribute("data-did"); var c=Math.round(num(inp.value)); if(c<0)c=0; t.drinks[id]=c; inp.classList.toggle("zero",c===0); refresh(); });
        inp.addEventListener("blur", function(){ var id=inp.getAttribute("data-did"); inp.value=Math.round(num(t.drinks[id])); });
        inp.addEventListener("focus", function(){ inp.select && inp.select(); });
      });
    }

    function buildSummary(){
      var rec=buildRecord(empId);
      var saved=false;
      for(var i=0;i<state.history.length;i++){ var x=state.history[i]; if(x.date===rec.date && x.empId===empId){ saved=true; break; } }
      var html=payslipHTML(rec)
        +'<button class="ps-save'+(saved?' saved':'')+'" id="cdSave">'+(saved?'✓ 保存済み（更新する）':'この明細を履歴に保存')+'</button>'
        +'<div class="ps-note">スクリーンショットで明細を保存できます</div>';
      el("cdScroll").innerHTML=html;
      el("cdSave").addEventListener("click", function(){
        if(rec.total<=0){ toast("入力がありません"); return; }
        var isNew=upsertRecord(buildRecord(empId)); save();
        el("cdSave").classList.add("saved"); el("cdSave").textContent="✓ 保存しました";
        toast(isNew?"履歴に保存しました":"明細を更新しました");
      });
    }

    function setMode(m){
      mode=m;
      el("mInput").classList.toggle("on",m==="input");
      el("mSum").classList.toggle("on",m==="summary");
      el("cdFoot").style.display = m==="input" ? "" : "none";
      if(m==="input") buildInput(); else buildSummary();
      el("cdScroll").scrollTop=0;
    }
    el("mInput").addEventListener("click", function(){ setMode("input"); });
    el("mSum").addEventListener("click", function(){ setMode("summary"); });
    el("cdClose").addEventListener("click", function(){ closeSheet(); renderCalc(); });

    buildInput(); refresh();
  }

  /* tabs */
  var titles={ calc:"計算", emp:"従業員", drink:"ドリンク", hist:"履歴" };
  function switchTab(name){
    currentTab=name;
    document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
    el("page-"+name).classList.add("active");
    document.querySelectorAll(".tab").forEach(function(tb){ tb.classList.toggle("active", tb.getAttribute("data-tab")===name); });
    el("navTitle").textContent=titles[name];
    el("summary").classList.toggle("show", name==="calc" && state.employees.length>0);
    if(name==="calc") renderCalc();
    if(name==="emp") renderEmp();
    if(name==="drink") renderDrinks();
    if(name==="hist"){ renderHistSummary(); renderHist(); }
    window.scrollTo(0,0); el("navbar").classList.remove("show");
  }

  function bind(){
    document.querySelectorAll(".tab").forEach(function(tb){ tb.addEventListener("click", function(){ switchTab(tb.getAttribute("data-tab")); }); });
    el("scrim").addEventListener("click", closeSheet);
    el("addEmpBtn").addEventListener("click", function(){ openEmpEdit(null); });
    el("addDrinkBtn").addEventListener("click", function(){ openDrinkEdit(null); });

    el("calcSearch").addEventListener("input", renderCalc);
    el("calcDate").addEventListener("change", function(){ if(el("calcDate").value){ state.workDate=el("calcDate").value; save(); } });
    el("empSearch").addEventListener("input", renderEmp);
    el("drinkSearch").addEventListener("input", renderDrinks);
    el("empSort").addEventListener("click", function(){ empReorder=!empReorder; this.classList.toggle("on",empReorder); this.textContent=empReorder?"完了":"並び替え"; if(empReorder) el("empSearch").value=""; renderEmp(); });
    el("drinkSort").addEventListener("click", function(){ drinkReorder=!drinkReorder; this.classList.toggle("on",drinkReorder); this.textContent=drinkReorder?"完了":"並び替え"; if(drinkReorder) el("drinkSearch").value=""; renderDrinks(); });

    el("btnCSV").addEventListener("click", exportCSV);
    el("btnBackup").addEventListener("click", exportJSON);
    el("btnRestore").addEventListener("click", function(){ el("restoreFile").click(); });
    el("restoreFile").addEventListener("change", function(){ if(this.files && this.files[0]) importJSON(this.files[0]); this.value=""; });

    el("resetBtn").addEventListener("click", function(){ if(!confirm("入力した勤務時間・杯数をクリアしますか？")) return; state.today={}; state.workDate=todayYMD(); save(); renderCalc(); toast("クリアしました"); });
    el("saveBtn").addEventListener("click", function(){
      var n=0;
      state.employees.forEach(function(e){ if(computeEmp(e.id).total>0){ upsertRecord(buildRecord(e.id)); n++; } });
      if(n===0){ toast("入力がありません"); return; }
      save(); toast(n+"名の明細を履歴に保存しました");
      switchTab("hist");
    });

    var ticking=false;
    window.addEventListener("scroll", function(){
      if(ticking) return; ticking=true;
      requestAnimationFrame(function(){ el("navbar").classList.toggle("show", window.scrollY>34); ticking=false; });
    }, {passive:true});
  }

  load(); save(); bind(); renderCalc();

  if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("./sw.js").catch(function(){}); });
  }
})();
</script>
